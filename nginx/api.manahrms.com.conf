# ManaHRMS API — nginx reverse proxy
# Upstream: uvicorn on 127.0.0.1:8000
#
# Usage (Linux server for api.manahrms.com):
#   sudo cp nginx/api.manahrms.com.conf /etc/nginx/sites-available/api.manahrms.com
#   sudo ln -sf /etc/nginx/sites-available/api.manahrms.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Local Windows (after installing nginx):
#   Copy this into nginx/conf/nginx.conf http{} as a server block,
#   or include it, then: nginx -s reload
#   Keep uvicorn running: uvicorn app.main:app --host 127.0.0.1 --port 8000

upstream manahrms_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# WebSocket upgrade map (required for Exotel voice stream + /ws)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name api.manahrms.com;

    # Optional: redirect HTTP → HTTPS when SSL is configured
    # return 301 https://$host$request_uri;

    client_max_body_size 30M;

    location / {
        proxy_pass http://manahrms_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (Exotel /api/v1/exotel/call/stream and /ws)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
}

